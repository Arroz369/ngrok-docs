[build]
  command = "pnpm run build"
  publish = "build"

[[redirects]]
  from = "/"
  to = "/docs/"
  status = 301

[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "upgrade-insecure-requests"
